generate:
  - types
  - client
accessModifier: internal
namingStrategy: idiomatic
# v1 is legacy and customer-specific (a `?apikey=` query credential, a different
# error vocabulary, no listing), and IAM and OAuth are not wrapped or are
# hand-written. Only the tags this client speaks are generated.
filter:
  tags:
    - Database v2
    - Lookup
    - Entitlement
# A value the API adds to a closed list must read as served, so these decode
# as strings and the hand-written layer opens them (Vocabulary.swift).
typeOverrides:
  schemas:
    DatabaseFormat: Swift.String
    Standing: Swift.String
    EntitlementPlan: WireEntitlementPlan
    Database: WireDatabase
    Download: WireDownload
