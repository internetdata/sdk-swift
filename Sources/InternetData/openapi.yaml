      description: >
        Answers what InternetData knows about one autonomous system: its registration on every plan,

        and on a paid one its ASN Whois record and every prefix it announces in global BGP, with
        RPKI status,

        up to 20000 per address family (the counts beside them are always whole). An AS no database
