        dns_resolver:
          allOf:
            - $ref: '#/components/schemas/DnsResolverDetail'
          description: '`{}` when `is_dns_resolver` is false. Paid plans and the trial.'
        bittorrent:
          allOf:
            - $ref: '#/components/schemas/BitTorrentDetail'
          description: '`{}` when `is_bittorrent` is false. Paid plans and the trial.'
        location:
          $ref: '#/components/schemas/Location'
        asn:
          $ref: '#/components/schemas/Asn'
        company:
          $ref: '#/components/schemas/Company'
        hostname:
          type: string
