      required:
        - ip
        - is_bogon
        - is_tor
        - is_relay
        - is_anycast
        - is_carrier
        - is_satellite
        - is_ssh
        - is_smtp
        - is_web
        - is_dns_resolver
        - is_bittorrent
        - tor
        - relay
        - location
        - asn
        - company
        - hostname
        - abuse
      description: What every database says about one address.
    ClassDetail:
      type: object
      properties:
        provider:
          type: string
          description: The provider's ID in its catalog; empty for an unattributed range, and on Tor.
        provider_name:
          type: string
