        id:
          type: string
          format: uuid
      required:
        - id
    AccountOrgWrap:
      type: object
      properties:
        rc:
          type: string
        org:
          $ref: '#/components/schemas/AccountOrg'
      required:
        - rc
        - org
    AccountOrg:
      type: object
      properties:
        id:
          type: string
          format: uuid
