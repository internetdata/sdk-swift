openapi: 3.0.3
info:
  title: InternetData API
  description: |
    The InternetData API: look up what every database InternetData publishes says
    about an IP address, an AS or a domain, download the databases your organization
    is licensed for, and manage the account behind them.

    See https://docs.internetdata.io for guides and https://github.com/internetdata
    for the official client libraries.
  contact:
    name: InternetData Support
    email: support@internetdata.io
    url: https://internetdata.io
  termsOfService: https://internetdata.io/terms
  version: 2026.11.13
servers:
  - url: https://internetdata.io
tags:
  - name: Database
    description: Download IP database files and fetch their checksums.
    x-displayName: Database
  - name: Database v2
    description: |
      The current database API. Authenticate with an API key carrying the
      `db.download` scope, presented any of three ways: `Authorization: Bearer
      <key>`, `X-Api-Key: <key>`, or `?apikey=<key>`. They are the same key;
      the query parameter is there for curl and the browser, which is how a
      database is usually fetched.

      Access is granted by CONTRACT, one dataset family at a time: there is no
      self-service purchase and no subscription behind it. The Open databases
      are licensed to every organization from the start, a `standard` license
      to each, and are free under CC BY-SA 4.0 besides. `list` marks them
      `open`.

      A successful download answers `302` with a time-limited URL pointing
      straight at object storage. Follow the redirect (`curl -L`); the link
      authorizes the START of a transfer, so a download already running is not
      interrupted when it lapses.
    x-displayName: Database v2
  - name: Account
    description: Who the credential belongs to, and what it may do.
    x-displayName: Account
  - name: Organization
    description: The organization it is scoped to.
    x-displayName: Organization
  - name: API keys
    description: Creating, listing and rotating credentials.
    x-displayName: API keys
  - name: Authorization
    description: Obtaining and revoking tokens.
    x-displayName: Authorization
  - name: Lookup
    description: Look up an address, an AS or a domain.
    x-displayName: Lookup
  - name: Entitlement
    description: What your key may spend, and what it has.
    x-displayName: Entitlement
paths:
  /api/v2/database/list:
    get:
      tags:
        - Database v2
      operationId: listDatabases
      summary: List
      description: |
        The whole published catalog, with your organization's license beside
        each entry, so `standing` says whether a database is yours today
        (`licensed`), was (`expired`), or has never been bought (`unlicensed`).
      security:
        - ApiKeyQueryAuth: []
        - ApiKeyHeaderAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - databases
                properties:
                  databases:
                    type: array
                    items:
                      $ref: '#/components/schemas/Database'
        '401':
          $ref: '#/components/responses/V2Unauthorized'
        '403':
          $ref: '#/components/responses/V2IpNotAllowed'
  /api/v2/database/download:
    get:
      tags:
        - Database v2
      operationId: downloadDatabaseV2
      summary: Download
      description: |
        Answers `302`; the bytes come straight from object storage rather than
        through this API. Follow the redirect.
      security:
        - ApiKeyQueryAuth: []
        - ApiKeyHeaderAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DbId'
        - $ref: '#/components/parameters/DbFormat'
        - $ref: '#/components/parameters/DbBuild'
      responses:
        '302':
          description: Follow the Location header to object storage.
          headers:
            Location:
              schema:
                type: string
        '400':
          description: |
            The database is not built in the requested format (`INVALID_FORMAT`),
            or `build` is not a build's name (`INVALID_BUILD`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/V2Unauthorized'
        '403':
          $ref: '#/components/responses/V2Forbidden'
        '404':
          $ref: '#/components/responses/V2UnknownDatabase'
        '410':
          description: |
            The build named in `build` is no longer kept (`BUILD_GONE`): builds are
            kept 7 days. Download without `build` for the live one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/V2NotAvailable'
  /api/v2/database/metadata:
    get:
      tags:
        - Database v2
      operationId: databaseMetadataV2
      summary: Metadata
      description: |
        Poll this to decide whether today's build is worth fetching: it carries
        `updated` and `entries` without downloading anything.

        No `format` parameter - one document describes every format the database
        is built in. Needs no license: it answers for every database `list`
        returns, whatever its `standing`.
      security:
        - ApiKeyQueryAuth: []
        - ApiKeyHeaderAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DbId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseMetadata'
        '401':
          $ref: '#/components/responses/V2Unauthorized'
        '403':
          $ref: '#/components/responses/V2IpNotAllowed'
        '404':
          $ref: '#/components/responses/V2UnknownDatabase'
        '503':
          $ref: '#/components/responses/V2NotAvailable'
  /api/v2/database/checksum:
    get:
      tags:
        - Database v2
      operationId: databaseChecksumV2
      summary: Checksums
      description: |
        Checksums for one published file, so a download can be verified after it lands.
      security:
        - ApiKeyQueryAuth: []
        - ApiKeyHeaderAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DbId'
        - $ref: '#/components/parameters/DbFormat'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - format
                  - checksums
                properties:
                  id:
                    type: string
                  format:
                    $ref: '#/components/schemas/DatabaseFormat'
                  checksums:
                    $ref: '#/components/schemas/DbChecksums'
        '400':
          description: The database is not built in the requested format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/V2Unauthorized'
        '403':
          $ref: '#/components/responses/V2Forbidden'
        '404':
          $ref: '#/components/responses/V2UnknownDatabase'
        '503':
          $ref: '#/components/responses/V2NotAvailable'
  /api/v2/database/downloads:
    get:
      tags:
        - Database v2
      operationId: listDownloads
      summary: History
      description: |
        Refusals are listed too: a denial is what answers "it stopped working",
        and its absence answers nothing.
      security:
        - ApiKeyQueryAuth: []
        - ApiKeyHeaderAuth: []
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: How many attempts to return. Clamped to 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - downloads
                properties:
                  downloads:
                    type: array
                    items:
                      $ref: '#/components/schemas/Download'
        '401':
          $ref: '#/components/responses/V2Unauthorized'
        '403':
          $ref: '#/components/responses/V2IpNotAllowed'
  /api/v1/database/download:
    get:
      tags:
        - Database
      operationId: databaseDownload
      summary: Download
      description: |
        Returns the requested database file as a binary download.
        The response's `Content-Type` depends on `format`:
        `application/gzip` for `csvgz`, `application/octet-stream` for `mmdb`.
      parameters:
        - $ref: '#/components/parameters/DbId'
        - $ref: '#/components/parameters/DbFormat'
      responses:
        '200':
          description: Database file.
          headers:
            Content-Disposition:
              description: Attachment with the database filename.
              schema:
                type: string
          content:
            application/gzip:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - ApiKeyAuth: []
  /api/v1/database/checksum:
    get:
      tags:
        - Database
      operationId: databaseChecksum
      summary: Checksums
      description: |
        Returns MD5, SHA-1, SHA-256, and SHA-512 checksums for the currently
        published version of the requested database.
      parameters:
        - $ref: '#/components/parameters/DbId'
        - $ref: '#/components/parameters/DbFormat'
      responses:
        '200':
          description: Checksums for the requested database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbChecksumSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - ApiKeyAuth: []
  /api/v1/database/metadata:
    get:
      tags:
        - Database
      operationId: databaseMetadata
      summary: Metadata
      description: |
        Returns publish freshness information for the currently published version
        of the requested database: when it was last updated, how many entries
        the dataset contains, and the size of each output format in bytes.
      parameters:
        - $ref: '#/components/parameters/DbId'
      responses:
        '200':
          description: Metadata for the requested database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbMetadataSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - ApiKeyAuth: []
  /api/v1/iam/identity:
    get:
      operationId: accountIdentity
      tags:
        - Account
      summary: Identity
      description: |
        The identity behind this credential: what it is, the organization it is
        scoped to, and the scopes it currently holds.

        `user` is present for an OAuth token and ABSENT for an API key, which
        has an organization but no person behind it. `credential.kind` says
        which you are holding, so a client can branch without guessing from a
        missing field.

        Narrower than what the console shows its own user on purpose: an
        integration needs a name to display and an organization to address, not
        a profile. The `scopes` array is what the credential may do RIGHT NOW,
        so a client can render its own capabilities rather than discovering
        them from a 403.
      security:
        - BearerAuth:
            - account.read
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
              examples:
                ok:
                  summary: A token granted read access
                  value:
                    rc: SUCCESS
                    user:
                      id: 3d86d1ef-f70b-4063-a3b8-f69605a8fc57
                      fullname: Ada Lovelace
                      email: ada@example.com
                    org:
                      id: 7b309476-0e70-4225-9a46-5e25650094dd
                    scopes:
                      - account.read
                      - apikeys.read
        '401':
          $ref: '#/components/responses/AccountUnauthorized'
        '403':
          $ref: '#/components/responses/AccountForbidden'
  /api/v1/iam/org:
    get:
      operationId: accountOrg
      tags:
        - Organization
      summary: Organization
      description: |
        The organization this credential is scoped to.

        There is no way to name a different one. A credential describes exactly
        one organization, so an identifier in the path could only ever be your
        own or a refusal.
      security:
        - BearerAuth:
            - org.read
      responses:
        '200':
          description: The organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountOrgWrap'
        '401':
          $ref: '#/components/responses/AccountUnauthorized'
        '403':
          $ref: '#/components/responses/AccountForbidden'
  /api/v1/iam/org/members:
    get:
      operationId: accountOrgMembers
      tags:
        - Organization
      summary: Members
      description: |
        Read-only. Adding or removing a member is an invitation flow with email
        in the middle rather than a POST, and modeling it as one here would
        promise something this API does not do.
      security:
        - BearerAuth:
            - org.read
      responses:
        '200':
          description: The members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRc'
        '401':
          $ref: '#/components/responses/AccountUnauthorized'
        '403':
          $ref: '#/components/responses/AccountForbidden'
  /api/v1/iam/apikeys:
    get:
      operationId: accountListApikeys
      tags:
        - API keys
      summary: List
      description: |
        Metadata only. A key's secret is never in a list - not here and not in
        the console - because a list is the response that ends up in logs,
        caches and support tickets.

        `retrievable` says whether the secret could still be read back at all.
        A key issued before this product stored secrets recoverably was never
        kept, so `reveal` will refuse it permanently; rotating produces one
        that can be read.
      security:
        - BearerAuth:
            - apikeys.read
      responses:
        '200':
          description: The organization's keys, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApikeyList'
        '401':
          $ref: '#/components/responses/AccountUnauthorized'
        '403':
          $ref: '#/components/responses/AccountForbidden'
    post:
      operationId: accountCreateApikey
      tags:
        - API keys
      summary: Create
      description: |
        Creates a key and returns its secret.

        This is the ONLY response that ever carries the secret, and only
        because this is the moment it comes into existence. Store it now.
      security:
        - BearerAuth:
            - apikeys.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateApikeyRequest'
      responses:
        '200':
          description: The new key, including its secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreatedApikey'
        '400':
          $ref: '#/components/responses/AccountInvalid'
        '401':
          $ref: '#/components/responses/AccountUnauthorized'
        '403':
          $ref: '#/components/responses/AccountForbidden'
  /api/v1/iam/apikeys/{id}/rotate:
    post:
      operationId: accountRotateApikey
      tags:
        - API keys
      summary: Rotate
      description: |
        Replaces the secret behind a key, keeping its ID, name and settings.
        The previous secret stops working immediately. The new secret comes
        back in the answer, so this needs `apikeys.reveal` as well as
        `apikeys.manage`.
      security:
        - BearerAuth:
            - apikeys.manage
            - apikeys.reveal
      parameters:
        - $ref: '#/components/parameters/ApikeyIdParam'
      responses:
        '200':
          description: The key, with its new secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreatedApikey'
        '401':
          $ref: '#/components/responses/AccountUnauthorized'
        '403':
          $ref: '#/components/responses/AccountForbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
  /api/v1/iam/apikeys/{id}/revoke:
    post:
      operationId: accountRevokeApikey
      tags:
        - API keys
      summary: Revoke
      description: |
        Stops the key working. Revocation is soft: the key stays listed with a
        `revoked_at`, because the organization still owns whatever it did while
        it was alive.
      security:
        - BearerAuth:
            - apikeys.manage
      parameters:
        - $ref: '#/components/parameters/ApikeyIdParam'
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRc'
        '401':
          $ref: '#/components/responses/AccountUnauthorized'
        '403':
          $ref: '#/components/responses/AccountForbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
  /api/v1/iam/apikeys/{id}/reveal:
    post:
      operationId: accountRevealApikey
      tags:
        - API keys
      summary: Reveal
      description: |
        Returns an existing key's secret.

        Its own scope rather than part of `apikeys.manage`, because the two are
        different acts: rotating replaces a secret you never see, while this
        hands one over.

        Refused with `NOT_RETRIEVABLE` for a key issued before this product
        stored secrets recoverably - that secret was never kept, so no retry
        will ever produce it. Rotate the key instead.
      security:
        - BearerAuth:
            - apikeys.reveal
      parameters:
        - $ref: '#/components/parameters/ApikeyIdParam'
      responses:
        '200':
          description: The key's secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRevealedApikey'
        '401':
          $ref: '#/components/responses/AccountUnauthorized'
        '403':
          $ref: '#/components/responses/AccountForbidden'
        '404':
          description: |
            No such key in this organization, or its secret was never stored
            recoverably (`NOT_RETRIEVABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRc'
  /.well-known/oauth-authorization-server:
    get:
      operationId: oauthMetadata
      tags:
        - Authorization
      summary: Discovery
      description: |
        RFC 8414 authorization server metadata: the endpoints, the grant types
        and the scopes this server supports.

        Read this rather than hardcoding endpoints. It is also served at
        `/.well-known/openid-configuration`, identically, because several
        clients probe that path first.
      security: []
      responses:
        '200':
          description: The server's metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthMetadata'
  /oauth/device_authorization:
    post:
      operationId: oauthDeviceAuthorization
      tags:
        - Authorization
      summary: Device authorization
      description: |
        Starts the device flow. Show the `user_code` to the person and send them
        to `verification_uri`; `verification_uri_complete` has the code already
        embedded, which is what to open if you can open a browser at all.

        Then poll `/oauth/token`, no faster than `interval` seconds.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceAuthorizationRequest'
      responses:
        '200':
          description: A pending device authorization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorization'
        '400':
          description: |
            `invalid_request`, `unauthorized_client` when the client may not use
            the device flow, or `slow_down` when this address has started too
            many authorizations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthError'
        '401':
          description: '`invalid_client`: the `client_id` is not registered.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthError'
  /oauth/register:
    post:
      operationId: oauthRegister
      tags:
        - Authorization
      summary: Register
      description: |
        RFC 7591 dynamic client registration, for a client that cannot use a
        Client ID Metadata Document. Post your client's metadata as JSON, then
        use the `client_id` in the answer at `/oauth/authorize` and
        `/oauth/token`. Nothing is kept until a person approves your client, so
        registering again costs nothing and leaves nothing to clean up.

        Each redirect URI must be https on a public host name, or http on a
        loopback address (`127.0.0.1`, `[::1]`, `localhost`), which then
        matches on any port. A custom URI scheme is refused: use a loopback
        redirect instead. So is a host on one of our own domains.

        `client_name` is shown to the person as your client's own claim, with
        where its redirect goes beside it. A name that renders blank, or mixes
        Latin letters with Cyrillic or Greek ones, is shown as an unnamed
        application.

        The client is public whatever you ask for: `token_endpoint_auth_method`
        comes back `none`, there is no client secret, and every authorization
        proves itself with PKCE. It may be granted `apikeys.use` at most.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRegistrationRequest'
      responses:
        '201':
          description: The client, as registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRegistration'
        '400':
          description: |
            `invalid_redirect_uri` names the redirect URI refused and why, and
            `invalid_client_metadata` anything else, such as a client that
            does not use the authorization code flow. `slow_down` means this
            address registered too many clients in the last minute.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthError'
  /oauth/authorize:
    get:
      operationId: oauthAuthorize
      tags:
        - Authorization
      summary: Authorize
      description: |
        The browser entry point for the authorization-code flow. This is a
        redirect target, not something to call from code.

        Any client may sign in without registering first by using a Client ID
        Metadata Document: make `client_id` an https URL that serves your
        client's metadata as JSON, naming that same URL as its `client_id`,
        with `token_endpoint_auth_method` `none` and your `redirect_uris`. An
        https redirect URI must be on the same origin as the `client_id`; a
        loopback one (`http://127.0.0.1`, `http://[::1]`, `http://localhost`)
        matches on any port. Such a client is granted `apikeys.use` at most. A
        client registered at `/oauth/register` uses the `client_id` it was
        given and one of the `redirect_uris` it registered.

        An unknown `client_id` or an unregistered `redirect_uri` is shown to the
        person and never redirected, because sending an error to an address we
        have not verified belongs to you is how an open redirector works. Any
        other error in the request is shown to the person too: anyone can make a
        client, so its `redirect_uri` is verified only as its own (RFC 9700
        section 4.11.2). Only the person's answer comes back to your
        `redirect_uri`: a `code`, or `error` `access_denied`, each with your
        `state` and `iss`.
      security: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - code
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum:
              - S256
          description: S256, named explicitly. `plain`, or no method at all, is refused rather than downgraded.
        - name: scope
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: Returned unchanged. Use it to bind the response to your request.
        - name: resource
          in: query
          required: false
          schema:
            type: string
          description: |
            RFC 8707. What the token is FOR, so it cannot be replayed elsewhere:
            this brand's MCP server, the only resource it issues tokens for.
            Anything else answers `invalid_target`. A client that names none is
            given that server.
      responses:
        '302':
          description: A redirect to the consent screen.
        '400':
          description: Shown to the person. No error in the request is sent to your redirect_uri.
        '429':
          description: Shown to the user. Too many authorizations from one address.
  /oauth/token:
    post:
      operationId: oauthToken
      tags:
        - Authorization
      summary: Token
      description: |
        Issues tokens for three grant types: a device code, an authorization
        code and a refresh token.

        `urn:ietf:params:oauth:grant-type:device_code` polls a device
        authorization. Until the person approves it answers
        `authorization_pending`; poll faster than `interval` and it answers
        `slow_down`, which means widen your interval and keep it widened.

        `authorization_code` exchanges a code from `/oauth/authorize`, with the
        `code_verifier` matching the challenge you sent and the same
        `redirect_uri`. A code works once: presenting it again also revokes
        what the first exchange issued.

        `refresh_token` exchanges a refresh token. The presented token is
        consumed whatever happens next, so store the new one before using it.
        Presenting a consumed refresh token again ends the whole authorization,
        since it means the token was copied.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: |
            An RFC 6749 error. `authorization_pending` and `slow_down` are
            normal answers while polling a device authorization, not failures.
            `access_denied` means the person refused, and `expired_token` that
            the device code is no longer valid: it expired, or it was already
            exchanged or refused. `invalid_grant` means the code, device code or
            refresh token is not valid for this `client_id`. `invalid_target`
            means `resource` names something other than what was authorized.
            `slow_down` also answers any grant when this address sends too many
            requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthError'
        '401':
          description: '`invalid_client`: the `client_id` is not registered.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthError'
  /oauth/revoke:
    post:
      operationId: oauthRevoke
      tags:
        - Authorization
      summary: Revoke
      description: |
        RFC 7009. Always answers 200, even for a token that was never valid, so
        it can't be used to test whether a token is live.

        Revoking a refresh token ends the whole authorization and takes its
        access tokens with it. Revoking an access token affects only that token.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
      responses:
        '200':
          description: Always, whatever was presented.
          content:
            application/json:
              schema:
                type: object
