        abuse:
          $ref: '#/components/schemas/AbuseContact'
        whois:
          $ref: '#/components/schemas/Whois'
        rwhois:
          $ref: '#/components/schemas/Rwhois'
        hosted_domains:
          $ref: '#/components/schemas/HostedDomains'
        trial_expired:
          type: boolean
          description: >-
            On every answer to a key on the free plan, and on no other: `false` while the day's
