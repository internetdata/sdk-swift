    ApikeyDetail:
      description: Key METADATA. Never the key itself.
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key_prefix:
          type: string
          description: The leading, non-secret part, so a key is recognizable without storing it.
        created:
          type: string
          format: date-time
        expires:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        allowed_cidrs:
          type: array
          items:
            type: string
          description: Source-IP allowlist. EMPTY MEANS UNRESTRICTED, not deny-all.
        allowed_scopes:
          type: array
          items:
            type: string
        retrievable:
          type: boolean
          description: >-
            Whether this key's secret can still be read back. False permanently for a key issued
            before secrets were stored recoverably.
      required:
        - id
        - name
        - key_prefix
        - created
    AccountCreateApikeyRequest:
      type: object
      properties:
        name:
          type: string
          description: A label you will recognize later. Shown wherever the key is listed.
        allowed_scopes:
          type: array
          items:
            type: string
          description: >-
            What the new key may do. Omit for a key that carries no named scope, which is the safe
            default.
      required:
        - name
    AccountCreatedApikey:
      type: object
      properties:
        rc:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        key:
          type: string
          description: The secret. Returned once, here, and never again.
        key_prefix:
          type: string
        allowed_cidrs:
          type: array
          items:
            type: string
        allowed_scopes:
          type: array
          items:
            type: string
      required:
        - rc
        - id
        - key
    AccountRevealedApikey:
      type: object
      properties:
        rc:
          type: string
        key:
          type: string
          description: The secret.
      required:
        - rc
        - key
    OauthMetadata:
      type: object
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        device_authorization_endpoint:
          type: string
        revocation_endpoint:
          type: string
        scopes_supported:
          type: array
          items:
            type: string
        response_types_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
        client_id_metadata_document_supported:
          type: boolean
          description: Any client may sign in with an https `client_id` serving its own metadata.
        registration_endpoint:
          type: string
          description: RFC 7591 dynamic client registration, for a client that cannot serve its own metadata.
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
          description: Always `none`. Every client is public and has no secret.
        authorization_response_iss_parameter_supported:
          type: boolean
          description: RFC 9207. A redirect back from the authorization endpoint carries `iss`.
        service_documentation:
          type: string
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
    DeviceAuthorizationRequest:
      type: object
      properties:
        client_id:
          type: string
        scope:
          type: string
          description: >-
            Space-delimited. Anything your client is not registered for is dropped rather than
            refused.
        resource:
          type: string
          description: 'RFC 8707: what the token is for.'
      required:
        - client_id
    DeviceAuthorization:
      type: object
      properties:
        device_code:
          type: string
          description: Yours. Poll with it; never show it to anyone.
        user_code:
          type: string
          description: Short and typable. This is what the person confirms.
        verification_uri:
          type: string
        verification_uri_complete:
          type: string
          description: The same page with the code already filled in.
        expires_in:
          type: integer
          description: Seconds until both codes expire.
        interval:
          type: integer
          description: Seconds between polls.
      required:
        - device_code
        - user_code
        - verification_uri
        - expires_in
        - interval
    TokenRequest:
      type: object
      properties:
        grant_type:
          type: string
          description: '`urn:ietf:params:oauth:grant-type:device_code`, `authorization_code` or `refresh_token`.'
        client_id:
          type: string
        device_code:
          type: string
          description: Required by the device code grant.
        code:
          type: string
          description: Required by the authorization code grant.
        code_verifier:
          type: string
          description: Required by the authorization code grant.
        redirect_uri:
          type: string
          description: >-
            Required by the authorization code grant: the `redirect_uri` the code was issued
            against, exactly.
        resource:
          type: string
          description: 'Authorization code grant, optional: RFC 8707, and it must name what was authorized.'
        refresh_token:
          type: string
          description: Required by the refresh token grant.
      required:
        - grant_type
        - client_id
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          description: Always `Bearer`.
        expires_in:
          type: integer
          description: Seconds until the access token expires.
        refresh_token:
          type: string
          description: Always returned. A refresh consumes the token it presents, so keep this one.
        scope:
          type: string
          description: What was actually granted, which may be narrower than what was asked for.
        mslm:apikey_id:
          type: string
          description: |
            Not part of OAuth, and only for our own clients. The ID of the API
            key the person picked when they approved, returned by every grant
            while this authorization may still read that key back. Absent when
            no key was picked, or when the person's role no longer allows
            reading keys back.
        mslm:apikey:
          type: string
          description: |
            Not part of OAuth, and only for our own clients: a client that signed
            in with a Client ID Metadata Document or registered itself never
            receives a key. The API
            key itself, so a device ends up holding an ordinary key. Returned by
            the device code and authorization code grants only, never by a
            refresh, and only alongside
            `mslm:apikey_id`. Absent when that key's secret cannot be read back,
            which is the case for a key created before keys could be shown again
            in the console; a rotated key can be.
      required:
        - access_token
        - token_type
        - expires_in
    ClientRegistrationRequest:
      type: object
      properties:
        redirect_uris:
          type: array
          items:
            type: string
          description: One to ten, each matched exactly, apart from a loopback one's port.
        client_name:
          type: string
          description: >-
            Shown to the person as your client's own claim, marked unverified, beside where its
            redirect goes.
        grant_types:
          type: array
          items:
            type: string
          description: Must include `authorization_code` when given.
        response_types:
          type: array
          items:
            type: string
          description: Must include `code` when given.
        token_endpoint_auth_method:
          type: string
          description: Read as `none`, whatever is sent.
      required:
        - redirect_uris
    ClientRegistration:
      type: object
      properties:
        client_id:
          type: string
        client_id_issued_at:
          type: integer
          format: int64
          description: Unix seconds. 64-bit, since 32 bits run out on 2038-01-19.
        client_name:
          type: string
          description: As the person will see it.
        redirect_uris:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            type: string
          description: '`authorization_code` and `refresh_token`.'
        response_types:
          type: array
          items:
            type: string
        token_endpoint_auth_method:
          type: string
          description: Always `none`.
        scope:
          type: string
          description: 'The most this client may be granted: `apikeys.use`.'
      required:
        - client_id
        - client_id_issued_at
        - client_name
        - redirect_uris
        - token_endpoint_auth_method
    RevokeRequest:
      type: object
      properties:
        token:
          type: string
          description: An access token or a refresh token.
        client_id:
          type: string
          description: Accepted and not checked.
      required:
        - token
    OauthError:
      type: object
      properties:
        error:
          type: string
        error_description:
          type: string
      required:
        - error
    LookupResponse:
