          items:
            $ref: '#/components/schemas/DnsAddressRecord'
        mx:
          type: array
          items:
            $ref: '#/components/schemas/DnsMxRecord'
        ns:
          type: array
          items:
            $ref: '#/components/schemas/DnsNsRecord'
        cname:
