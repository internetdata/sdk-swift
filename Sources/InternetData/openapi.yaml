        tor:
          allOf:
            - $ref: '#/components/schemas/ClassDetail'
          description: Tor IP's row, `{}` when `is_tor` is false.
        relay:
          allOf:
            - $ref: '#/components/schemas/ClassDetail'
          description: Relay IP's row, `{}` when `is_relay` is false.
        resproxy:
          allOf:
            - $ref: '#/components/schemas/ProxyDetail'
          description: '`{}` when `is_resproxy` is false. Paid plans and the trial.'
        dcproxy:
          allOf:
            - $ref: '#/components/schemas/ProxyDetail'
          description: '`{}` when `is_dcproxy` is false. Paid plans and the trial.'
        mobproxy:
          allOf:
            - $ref: '#/components/schemas/ProxyDetail'
          description: '`{}` when `is_mobproxy` is false. Paid plans and the trial.'
        pubproxy:
          allOf:
            - $ref: '#/components/schemas/PubproxyDetail'
          description: '`{}` when `is_pubproxy` is false. Paid plans and the trial.'
        hosting:
          allOf:
            - $ref: '#/components/schemas/ClassDetail'
          description: '`{}` when `is_hosting` is false. Paid plans and the trial.'
        cdn:
          allOf:
            - $ref: '#/components/schemas/ClassDetail'
          description: '`{}` when `is_cdn` is false. Paid plans and the trial.'
        carrier:
          allOf:
            - $ref: '#/components/schemas/CarrierDetail'
          description: '`{}` when `is_carrier` is false. Paid plans and the trial.'
        satellite:
          allOf:
            - $ref: '#/components/schemas/SatelliteDetail'
          description: '`{}` when `is_satellite` is false. Paid plans and the trial.'
        ssh:
          allOf:
            - $ref: '#/components/schemas/SshDetail'
          description: '`{}` when `is_ssh` is false. Paid plans and the trial.'
        smtp:
          allOf:
            - $ref: '#/components/schemas/SmtpDetail'
          description: '`{}` when `is_smtp` is false. Paid plans and the trial.'
        web:
          type: array
          items:
            $ref: '#/components/schemas/WebDetail'
