components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: query
      name: apikey
      description: |
        UUID-format API key issued to the customer. Each key is authorized for a
        specific set of database IDs; requesting any other ID returns 403.

        v1 only. The v2 endpoints take a console-issued key as a bearer token.
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <key>`, with a key from the console. Keys are
        default-deny: each operation names the scope it needs, and an existing
        key does not gain an operation until that scope is added to it.
    ApiKeyHeaderAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: '`X-Api-Key: <key>`. The same v2 key, for clients that do not set a bearer.'
    ApiKeyQueryAuth:
      type: apiKey
      in: query
      name: apikey
      description: |
        `?apikey=<key>`. Convenient in a browser or a curl one-liner, which is
        how a database is usually fetched; prefer a header elsewhere.

        This is the same v2 key as the other two schemes. A v1 credential is a
        different vocabulary and fails validation here, as it would anywhere.
    bearerAuth:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <key>`.'
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: '`X-Api-Key: <key>`.'
    apiKeyQuery:
      type: apiKey
      in: query
      name: apikey
      description: '`?apikey=<key>`. Convenient in a browser; prefer a header elsewhere.'
  parameters:
    DbId:
      name: id
      in: query
      required: true
      description: Database identifier (e.g. `vpn_ip_v1`, `resproxy_provider_v1`).
      schema:
        type: string
        pattern: ^[a-zA-Z0-9_]+$
        example: vpn_ip_v1
    DbFormat:
      name: format
      in: query
      required: true
      description: Database file format.
      schema:
        $ref: '#/components/schemas/DatabaseFormat'
    DbBuild:
      name: build
      in: query
      required: false
      description: |
        One build of the database, by the name a `database.updated` webhook gives
        it, so the file is the one whose `sha256` the webhook carries. Without
        it, the build that is live.
      schema:
        type: string
        pattern: ^[0-9]{8}\.[a-z0-9]{6}$
        example: 20261105.0t53s5
    ApikeyIdParam:
      name: id
      in: path
      required: true
      description: The key's ID, as returned by the list endpoint. Never the key itself.
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      required:
        - rc
      properties:
        rc:
          type: string
          description: |
            A machine-readable result code. Deliberately not an enum: a code
            added later must stay parseable by a client generated today.
    DatabaseFormat:
      type: string
      description: A file format a database version is published in.
      enum:
        - csvgz
        - mmdb
      example: mmdb
    Standing:
      type: string
      description: |
        Where your license for a database family stands today. `licensed` is a
        live grant, `expired` one whose term has ended, and `unlicensed` a
        database published but never bought.
      enum:
        - licensed
        - expired
        - unlicensed
    Database:
      type: object
      description: |
        One database FAMILY, with your organization's license beside it. A
        license covers the family, while a download names a specific version,
        so the IDs passed to `download` and `checksum` come from `versions`.
      required:
        - base
        - name
        - summary
        - standing
        - open
        - license_type
        - starts
        - expires
        - renews_at
        - notice_due_at
        - versions
      properties:
        base:
          type: string
          description: The family, e.g. `vpn_ip`. What a license is held against.
          example: vpn_ip
        name:
          type: string
          example: VPN IP
        summary:
          type: string
          description: One line on what the newest version contains.
        standing:
          $ref: '#/components/schemas/Standing'
        open:
          type: boolean
          description: |
            An Open database: free under CC BY-SA 4.0 (credit InternetData,
            https://internetdata.io, and share what you build from it under
            the same license). Every organization holds a `standard` license
            to it from the start, which `standing` and `license_type` report
            like any other.
        license_type:
          type: string
          nullable: true
          enum:
            - evaluation
            - standard
            - redistribute
            - null
          description: |
            What your license permits you to do with the data. Null when there
            is no license, which is every family with standing `unlicensed`.
        starts:
          type: string
          format: date-time
          nullable: true
        expires:
          type: string
          format: date-time
          nullable: true
          description: >-
            A hard stop. Null when the license has no end date, which is the normal case for a
            rolling agreement, and when there is no license. A rolling license reports its turnover
            date in renews_at instead.
        renews_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When a rolling license next renews. Null when the license has no defined term, when
            expires sets a hard stop instead, and when there is no license.
        notice_due_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            The last day notice of non-renewal can be given for the term ending at renews_at. Null
            whenever renews_at is, and when the agreement records no notice period.
        versions:
          type: array
          description: |
            Every published version of this family, oldest first. Old versions
            are frozen rather than migrated, so both stay downloadable.
          items:
            $ref: '#/components/schemas/DatabaseVersion'
    DatabaseVersion:
      type: object
      required:
        - id
        - version
        - summary
        - formats
      properties:
        id:
          type: string
          description: The versioned ID. Pass this to `download`, `checksum` and `metadata`.
          example: vpn_ip_v1
        version:
          type: integer
          example: 1
        summary:
          type: string
        formats:
          type: array
          description: |
            The formats this version is BUILT in. Asking for another is a 400,
            not a gap - the `_provider` catalogs are keyed by provider ID, so no
            MMDB exists for them.
          items:
            $ref: '#/components/schemas/DatabaseFormat'
        sample_formats:
          type: array
          description: The formats an evaluation sample is published in, if any.
          items:
            $ref: '#/components/schemas/DatabaseFormat'
    Download:
      type: object
      description: One download ATTEMPT, refusals included.
      required:
        - dataset_id
        - format
        - outcome
        - sample
        - open
        - bytes
        - http_status
        - apikey_id
        - client_ip
        - user_agent
        - created
      properties:
        dataset_id:
          type: string
        format:
          type: string
        outcome:
          type: string
          enum:
            - ok
            - unauthorized
            - denied
            - expired
            - unknown
            - unavailable
        sample:
          type: boolean
          description: The evaluation sample rather than the database itself.
        open:
          type: boolean
          description: |
            A download of an Open database.
        bytes:
          type: integer
          format: int64
          nullable: true
          description: |
            Object size at redirect time, NOT bytes delivered: the transfer is a
            presigned redirect straight to object storage, so we never observe
            how much of it was taken.
        http_status:
          type: integer
          nullable: true
        apikey_id:
          type: string
          nullable: true
          description: The key that made the request. Null when it could not be resolved.
        client_ip:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        created:
          type: string
          format: date-time
    DatabaseMetadataColumn:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
        description:
          type: string
    DatabaseMetadata:
      type: object
      description: The build document written by the exporter, served through unchanged.
      required:
        - id
        - updated
        - entries
        - schema
        - size
      properties:
        id:
          type: string
        update_freq:
          type: string
          description: How often a new build is published.
        updated:
          type: string
          format: date
          description: ISO-8601 date (YYYY-MM-DD) the published build was generated on.
          example: '2026-09-04'
        entries:
          type: integer
          format: int64
          description: Row count in the current build.
        schema:
          type: object
          description: Columns, keyed by format.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/DatabaseMetadataColumn'
        sample:
          type: object
          description: A few real rows, keyed by format.
          additionalProperties:
            type: array
            items:
              type: object
        size:
          type: object
          description: Bytes per format.
          additionalProperties:
            type: integer
            format: int64
        sample_size:
          type: object
          description: Bytes per format of the evaluation sample, where one is published.
          additionalProperties:
            type: integer
            format: int64
        sample_entries:
          type: integer
          description: Row count in the evaluation sample.
    DbChecksumSuccessResponse:
      type: object
      required:
        - rc
        - data
      properties:
        rc:
          type: string
          enum:
            - SUCCESS
        data:
          $ref: '#/components/schemas/DbChecksums'
    DbChecksums:
      type: object
      required:
        - md5
        - sha1
        - sha256
        - sha512
      properties:
        md5:
          type: string
          description: Hex-encoded MD5 digest.
        sha1:
          type: string
          description: Hex-encoded SHA-1 digest.
        sha256:
          type: string
          description: Hex-encoded SHA-256 digest.
        sha512:
          type: string
          description: Hex-encoded SHA-512 digest.
    DbMetadataSuccessResponse:
      type: object
      required:
        - rc
        - data
      properties:
        rc:
          type: string
          enum:
            - SUCCESS
        data:
          $ref: '#/components/schemas/DbMetadata'
    DbMetadata:
      type: object
      required:
        - updated
        - entries
        - size
      properties:
        updated:
          type: string
          format: date
          description: >-
            ISO-8601 calendar date (YYYY-MM-DD) on which the currently published version was
            generated.
          example: '2026-04-25'
        entries:
          type: integer
          format: int64
          minimum: 0
          description: Number of data rows in the published dataset (excluding the CSV header).
          example: 114000000
        size:
          type: object
          required:
            - csvgz
          description: Sizes in bytes of the published files, keyed by format.
          properties:
            csvgz:
              type: integer
              format: int64
              minimum: 0
              description: Size of the gzipped CSV file in bytes.
            mmdb:
              type: integer
              format: int64
              minimum: 0
              description: Size of the MMDB file in bytes (omitted when the dataset has no MMDB output).
    DbInvalidApiKeyError:
      type: object
      required:
        - rc
      properties:
        rc:
          type: string
          enum:
            - INVALID_APIKEY
    DbInvalidFormatError:
      type: object
      required:
        - rc
      properties:
        rc:
          type: string
          enum:
            - INVALID_FORMAT
    DbInvalidIdError:
      type: object
      required:
        - rc
      properties:
        rc:
          type: string
          enum:
            - INVALID_ID
    DbUnauthorizedIdError:
      type: object
      required:
        - rc
      properties:
        rc:
          type: string
          enum:
            - UNAUTHORIZED_ID
    DbNotFoundError:
      type: object
      required:
        - rc
      properties:
        rc:
          type: string
          enum:
            - DB_NOT_FOUND
    AccountRc:
      type: object
