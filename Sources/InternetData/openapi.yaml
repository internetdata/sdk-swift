          description: The range.
        name:
          type: string
          description: Its registry name.
        country:
          type: string
          description: ISO 3166 country code.
      required:
        - range
        - name
        - country
    DisposableDetail:
      type: object
      properties:
        confidence:
          type: string
          description: '`high`, `medium` or `low`.'
        providers:
          type: array
          items:
            type: string
          description: The providers behind it.
        first_seen:
          type: string
          description: The first day seen in use.
        last_seen:
          type: string
          description: The last day.
    BatchLookupRequest:
      type: object
      properties:
        ips:
          type: array
          items:
            type: string
          description: Addresses.
        asns:
          type: array
          items:
            type: string
          description: AS numbers, `AS15169` or `15169`; a JSON number reads too.
        domains:
          type: array
          items:
            type: string
          description: Domains.
      description: Up to 1000 items across the three arrays, each optional.
    BatchLookupResponse:
      type: object
      properties:
        results:
          type: object
          additionalProperties:
            oneOf:
              - $ref: '#/components/schemas/LookupResponse'
              - $ref: '#/components/schemas/AsnLookupResponse'
              - $ref: '#/components/schemas/DomainLookupResponse'
          description: Each answered item's lookup, keyed by the string sent.
        errors:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/BatchLookupError'
          description: Each failed item, keyed by the string sent.
      required:
        - results
        - errors
    BatchLookupError:
      type: object
      properties:
        status:
          type: integer
          description: The status its own lookup would have answered.
        error:
          type: string
          description: The same message.
      required:
        - status
        - error
    LookupError:
      type: object
      properties:
        error:
          type: string
          description: What went wrong.
      required:
        - error
    Entitlement:
      type: object
      required:
        - org_id
        - apikey
        - plan
        - usage
      properties:
        org_id:
          type: string
          format: uuid
          description: The organization the key belongs to.
        apikey:
          $ref: '#/components/schemas/EntitlementApikey'
        plan:
          $ref: '#/components/schemas/EntitlementPlan'
        usage:
          $ref: '#/components/schemas/EntitlementUsage'
    EntitlementApikey:
      type: object
      description: |
        The credential itself. The key is never echoed - only its ID, which is
        what the console shows and what you can act on.
      required:
        - id
        - expires
        - allowed_cidrs
      properties:
        id:
          type: string
          format: uuid
        expires:
          type: string
          format: date-time
          nullable: true
          description: Null for a key with no end date, which is the normal case.
        allowed_cidrs:
          type: array
          items:
            type: string
          description: |
            The source addresses this key may be used from. EMPTY means
            unrestricted, never "deny all".
    EntitlementPlan:
      type: object
      required:
        - key
        - tier
      properties:
        key:
          type: string
          description: |
            The plan the organization is on: `free` for the free plan,
            Unlimited, or a paid plan's key. On `free`, usage counts the
            day's lookups answered with every field, its daily trial.
          example: max
        tier:
          type: string
          enum:
            - free
            - starter
            - scale
            - max
          description: |
            The field tier, which decides how much of a lookup answer comes
            back; `free` is the free plan's. What each tier includes is documented
            on the lookup endpoint rather than repeated here, so there is one
            place it can be wrong.
    EntitlementUsage:
      type: object
      required:
        - requests
        - quota
        - hard_limit
        - window_start
        - window_end
      properties:
        requests:
          type: integer
          format: int64
          description: |
            Requests counted in the current window. The same number the lookup
            API gates on, and it can lag by a few seconds.
        quota:
          type: integer
          format: int64
          description: What the plan includes. Zero on a plan that includes none.
        hard_limit:
          type: integer
          format: int64
          nullable: true
          description: |
            Where we stop serving. NULL means never, which is the normal state
            of an uncapped paid plan and is not the same as zero. Above the
            quota and below this, requests are served and billed as overage.
        window_start:
          type: string
          format: date-time
          description: When the current allowance period began.
        window_end:
          type: string
          format: date-time
          description: When the allowance next resets.
    EntitlementError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
  responses:
    V2Unauthorized:
      description: |
        Missing, invalid, revoked or expired key; the key lacks the
        `db.download` scope; or the key belongs to no active organization.
        Each answers the same.
        `rc`: `UNAUTHORIZED`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    V2IpNotAllowed:
      description: |
        The request comes from an address outside the key's or its
        organization's allowed addresses. Change the allowlist or call from an
        allowed address: the key itself is fine.
        `rc`: `IP_NOT_ALLOWED`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    V2Forbidden:
      description: |
        Your organization holds no license for this database (`NOT_LICENSED`),
        or its term has ended (`LICENSE_EXPIRED`); or the request comes from an
        address outside the key's or its organization's allowed addresses
        (`IP_NOT_ALLOWED`).
        `rc`: `NOT_LICENSED`, `LICENSE_EXPIRED`, `IP_NOT_ALLOWED`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    V2UnknownDatabase:
      description: |
        No such database.
        `rc`: `UNKNOWN_DATASET`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    V2NotAvailable:
      description: |
        The current build has not been published yet.
        `rc`: `NOT_AVAILABLE`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: |
        The request query parameters were malformed.
        Possible `rc` values: `INVALID_FORMAT`, `INVALID_ID`.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/DbInvalidFormatError'
              - $ref: '#/components/schemas/DbInvalidIdError'
    Unauthorized:
      description: The `apikey` query parameter was missing or not recognized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DbInvalidApiKeyError'
    Forbidden:
