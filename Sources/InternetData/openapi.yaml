          description: Reserved space, answered from the address alone.
        is_vpn:
          type: boolean
          description: 'In VPN IP: a VPN service''s server. Paid plans and the trial.'
        is_tor:
          type: boolean
          description: 'In Tor IP: a Tor exit.'
        is_relay:
          type: boolean
          description: 'In Relay IP: an anonymizing relay such as iCloud Private Relay.'
        is_resproxy:
          type: boolean
          description: >-
            In Residential Proxy IP's 90-day window: a residential proxy exit. Paid plans and the
            trial.
        is_dcproxy:
          type: boolean
          description: In Datacenter Proxy IP's 90-day window. Paid plans and the trial.
        is_mobproxy:
          type: boolean
          description: In Mobile Proxy IP's 90-day window. Paid plans and the trial.
        is_pubproxy:
          type: boolean
          description: >-
            In Public Proxy IP: a public proxy listens here, or its traffic left from here. Paid
            plans and the trial.
        is_hosting:
          type: boolean
          description: 'In Hosting IP: a hosting or cloud network. Paid plans and the trial.'
        is_cdn:
          type: boolean
          description: 'In CDN IP: a content delivery network. Paid plans and the trial.'
        is_anycast:
          type: boolean
          description: 'In Anycast IP: announced from many places at once.'
        is_carrier:
          type: boolean
          description: 'In Carrier IP: a mobile carrier''s address space.'
        is_satellite:
          type: boolean
          description: 'In Satellite IP: a satellite operator''s address space.'
        is_ssh:
          type: boolean
          description: 'In SSH IP: an SSH server answered here.'
        is_smtp:
          type: boolean
          description: 'In SMTP IP: a mail server answered here.'
        is_web:
          type: boolean
          description: 'In Web IP: a web server answered here on port 80 or 443.'
        is_dns_resolver:
          type: boolean
          description: 'In DNS Resolver IP: an open DNS resolver answered here.'
        is_bittorrent:
