          description: The first 1000, IPv4 before IPv6, the largest first.
      required:
        - domain
        - redirects_to
        - total
        - ipv4
        - ranges
      description: The organization's IP ranges, from Domain IP Ranges. Paid plans and the trial.
    DomainIpRange:
      type: object
      properties:
        range:
